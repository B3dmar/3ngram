name: Bug report
description: Report something that is broken or behaving incorrectly
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please give us enough detail to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps to trigger the bug.
      placeholder: |
        1. Call the MCP tool `...` with `...`
        2. Observe `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including any error output or logs (redact memory content — IDs, types, hashes only).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version / environment
      description: Package version(s), commit SHA, transport (MCP / REST / CLI / SDK), OS, runtime.
      placeholder: |
        - 3ngram version / commit:
        - Transport:
        - OS / runtime:
    validations:
      required: true
