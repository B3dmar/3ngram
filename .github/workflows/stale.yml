# SPDX-License-Identifier: Apache-2.0
# Inactive issue/PR hygiene.
# RULE: actions pinned by full SHA, never tags (scripts/check-action-pins.sh).
name: stale

on:
  schedule:
    - cron: "17 3 * * *" # daily, off-peak
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: true

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,never-stale
          exempt-pr-labels: pinned,security,never-stale
          exempt-all-milestones: true
          stale-issue-message: >-
            This issue has been inactive for 60 days and is marked stale.
            It will close in 14 days unless there is new activity or the
            `never-stale` label is applied.
          stale-pr-message: >-
            This pull request has been inactive for 30 days and is marked
            stale. It will close in 14 days unless there is new activity or
            the `never-stale` label is applied.
          close-issue-message: >-
            Closed for inactivity. If this is still relevant, comment or
            reopen — see SUPPORT.md for where questions are answered.
          close-pr-message: >-
            Closed for inactivity. Rebase on `staging` and reopen if you
            want to continue this change.
          operations-per-run: 100
