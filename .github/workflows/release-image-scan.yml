# SPDX-License-Identifier: Apache-2.0
# release-image-scan.yml — the release image scan, before a tag exists.
#
# release-publish.yml scans the server and worker runner images after a v* tag
# is pushed, and `immutable-v-tags` burns the version when that scan fails
# (v1.6.2, v1.8.0, v1.8.3, v1.9.0). This workflow runs the same composite
# action (.github/actions/release-image-scan) earlier, on:
#   - version PRs (head changeset-release/*);
#   - the promotion PR (head staging, base main), the run closest to the tag;
#   - PRs that change the scan definition, release-publish.yml, .dockerignore
#     or either runner Dockerfile (this covers Renovate base-digest bumps);
#   - workflow_dispatch on any ref (`gh workflow run release-image-scan.yml
#     --ref main`), for a last check right before tagging.
# Every other PR passes after a cheap path check, with a notice and a job
# summary line saying the scan was not needed. Advisories can still land
# between this run and the tag push; the post-tag scan stays as the backstop.
#
# RULE: actions pinned by full SHA, never tags (scripts/check-action-pins.sh).
name: release-image-scan

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-image-scan:
    name: release-image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a PR's merge commit and both parents, for the path check
          persist-credentials: false
      # One job that always reports, so a required check fails closed: a
      # broken gate fails this job rather than skipping the scan.
      - name: Decide whether this run needs the release scan
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The scan definition, its post-tag caller, the build context and the
          # runner Dockerfiles. Lockfile bumps are left out on purpose: they are
          # frequent, and each reaches a tag only through a version PR and the
          # promotion PR, which always scan.
          scan_paths='^(\.github/actions/release-image-scan/|\.github/workflows/release-(image-scan|publish)\.yml$|\.dockerignore$|apps/(server|worker)/Dockerfile$)'
          scan=false
          reason="not a version PR (head changeset-release/*) or the staging -> main promotion PR, and no change to a scan path (scan definition, release-publish.yml, .dockerignore, runner Dockerfiles)"
          if [[ "$EVENT_NAME" != pull_request ]]; then
            scan=true reason="manual ${EVENT_NAME} run"
          elif [[ "$HEAD_REF" == changeset-release/* ]]; then
            scan=true reason="version PR (head ${HEAD_REF})"
          elif [[ "$HEAD_REF" == staging && "$BASE_REF" == main ]]; then
            scan=true reason="promotion PR (staging -> main)"
          else
            # HEAD is the PR merge commit; HEAD^1 is the base tip.
            changed=$(git diff --name-only HEAD^1 HEAD)
            matched=$(grep -E "$scan_paths" <<<"$changed") || [[ $? -eq 1 ]]
            if [[ -n "$matched" ]]; then
              scan=true reason="PR changes a scan path: $(paste -sd ' ' - <<<"$matched")"
            fi
          fi
          echo "event=${EVENT_NAME} head=${HEAD_REF:-n/a} base=${BASE_REF:-n/a} scan=${scan}"
          if [[ "$scan" == true ]]; then
            echo "Release image scan runs: ${reason}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::release image scan not needed for this PR"
            echo "Release image scan not needed: ${reason}." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "scan=${scan}" >> "$GITHUB_OUTPUT"
      # Build caches are scoped per PR (or per dispatch run) and never use the
      # `release` prefix, so the first scan of a PR builds cold like a tag run
      # and nothing here can seed release-publish.yml's cache.
      - name: Build and scan both runner images on both platforms
        if: ${{ steps.gate.outputs.scan == 'true' }}
        uses: ./.github/actions/release-image-scan
        with:
          image-tag: ${{ github.sha }}
          cache-scope-prefix: pretag-${{ github.event.pull_request.number || github.run_id }}
