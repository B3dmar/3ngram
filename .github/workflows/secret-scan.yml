# SPDX-License-Identifier: Apache-2.0
# secret-scan.yml — gitleaks secret scanning in GIT (patch) mode.
# Scans git LOG PATCHES, not just the checked-out tree: with the merge-commit PR
# flow a contributor can add a secret in one commit and remove it before the
# final tree, leaving the blob reachable in history after merge. Git-mode over
# the PR commit range (base..head) catches those added-then-removed secrets;
# push to a protected branch scans the full branch history.
# Runs the pinned gitleaks BINARY directly (not gitleaks/gitleaks-action) because
# that action requires a paid GITLEAKS_LICENSE for organization-owned repos; the
# binary is free and deterministic. Config: .gitleaks.toml (value-scoped
# allowlist of intentional self-host dev defaults).
# RULE: actions pinned by full SHA, never tags (scripts/check-action-pins.sh).
name: secret-scan

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # full history so git-mode can scan the PR commit range
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Scan only the commits this PR adds (base..head) so a secret added
            # in one commit and removed before the final tree is still caught.
            LOG_OPTS="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            # push to a protected branch: scan the full branch history.
            LOG_OPTS="--all"
          fi
          echo "gitleaks git mode (log-opts: ${LOG_OPTS})"
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="${LOG_OPTS}" \
            --redact \
            --no-banner \
            --exit-code 1
