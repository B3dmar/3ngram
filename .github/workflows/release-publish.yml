# SPDX-License-Identifier: Apache-2.0
# release-publish.yml — npm + GHCR + GitHub release for the v1 artifact closure.
#
# Publishes @3ngram/{config,schema,llm,db,core,server,sdk} plus the bare
# `3ngram` CLI to PUBLIC npm (per-package `publishConfig.access: "public"`).
# `worker` stays `private: true` — changesets versions it with the fixed
# group but never publishes it.
#
# Trigger: a strict vMAJOR.MINOR.PATCH tag whose commit is reachable from main.
# workflow_dispatch exists for the bootstrap/retry path but MUST target that
# tag ref. Validation happens before any job with publish permissions.
#
# AUTH: npm TRUSTED PUBLISHING (OIDC) — no token. Each published package has
# a Trusted Publisher registered on npmjs.com (GitHub Actions, org B3dmar,
# repo 3ngram, workflow release-publish.yml — owner/repo match is
# case-sensitive). pnpm performs the OIDC exchange itself when it finds no
# registry token and the job grants `id-token: write`. Publishes fail
# loudly if the OIDC exchange fails — there is deliberately no token
# fallback.
#
# PROVENANCE: left to pnpm's auto-detection (it reads the OIDC token's
# repository_visibility claim). While this repo is PRIVATE, npm REJECTS
# provenance bundles (E422), so pnpm skips them; the moment the repo goes
# public, attestations attach automatically with no workflow change. Do
# NOT force `pnpm_config_provenance=true` — it overrides the visibility
# check and breaks every publish until the repo is public.
#
# NEW PACKAGES: a package's FIRST publish cannot use a trusted publisher —
# it needs a one-off granular token (or a manual local publish), after
# which the owner registers its trusted publisher on npmjs.com.
#
# Supply chain: actions pinned by full SHA (scripts/check-action-pins.sh),
# frozen lockfile, lifecycle scripts denied by pnpm-workspace.yaml policy,
# OIDC trusted publishing + provenance — AGENTS.md hard rule 7.
name: release-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag and main ancestry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Validate immutable release source
        id: release
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release ref must be an exact vMAJOR.MINOR.PATCH tag, got '$RELEASE_REF'" >&2
            exit 1
          fi

          if [[ "$REPOSITORY_VISIBILITY" != "public" ]]; then
            echo "v1 releases require a public source repository; visibility is '$REPOSITORY_VISIBILITY'" >&2
            exit 1
          fi

          version=${RELEASE_TAG#v}
          for manifest in \
            apps/server/package.json \
            apps/worker/package.json \
            apps/cli/package.json \
            packages/sdk/package.json; do
            package_version=$(jq --raw-output '.version' "$manifest")
            if [[ "$package_version" != "$version" ]]; then
              echo "$manifest is version $package_version, expected release version $version" >&2
              exit 1
            fi
          done

          if [[ ! -f ".github/release-notes/${version}.md" ]]; then
            echo "missing curated release notes for ${version}" >&2
            exit 1
          fi

          commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "release commit $commit is not reachable from origin/main" >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$commit" ]]; then
            echo "checked-out commit does not match the release tag target" >&2
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  container-scan:
    name: Scan release image (amd64 + arm64)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build linux/amd64 image for pre-publish scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: runner
          platforms: linux/amd64
          pull: true
          load: true
          tags: 3ngram-release-scan:${{ needs.validate.outputs.commit }}-amd64
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,mode=max,scope=release-amd64
          provenance: false
          sbom: false
      - name: Scan linux/amd64 fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: 3ngram-release-scan:${{ needs.validate.outputs.commit }}-amd64
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Build linux/arm64 image for pre-publish scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: runner
          platforms: linux/arm64
          pull: true
          load: true
          tags: 3ngram-release-scan:${{ needs.validate.outputs.commit }}-arm64
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,mode=max,scope=release-arm64
          provenance: false
          sbom: false
      - name: Scan linux/arm64 fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: 3ngram-release-scan:${{ needs.validate.outputs.commit }}-arm64
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

  ghcr:
    name: Publish ghcr.io/b3dmar/3ngram
    needs: [validate, container-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags and OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/b3dmar/3ngram
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.commit }}
      - name: Build and publish multi-platform image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=gha,scope=release-amd64
            type=gha,scope=release-arm64
          cache-to: type=gha,mode=max,scope=release
          provenance: mode=max
          sbom: true
      - name: Attest the published image
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ghcr.io/b3dmar/3ngram
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ needs.validate.outputs.version }}
          push-to-registry: true

  ghcr-public:
    name: Verify anonymous GHCR pull
    needs: [validate, ghcr]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # A new GHCR package defaults to private. This fresh job deliberately has
      # no package permission or registry login, so both reads prove that users
      # can pull the version tag and the immutable digest anonymously. The first
      # release pauses here until an owner makes the package public; rerunning
      # failed jobs then unlocks npm publication without republishing the image.
      - name: Verify public version tag and digest
        env:
          IMAGE_DIGEST: ${{ needs.ghcr.outputs.digest }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          image=ghcr.io/b3dmar/3ngram
          docker manifest inspect "${image}:${RELEASE_VERSION}" >/dev/null
          docker manifest inspect "${image}@${IMAGE_DIGEST}" >/dev/null

  npm-publish:
    name: Publish @3ngram closure (npm, OIDC trusted publishing)
    needs: [validate, ghcr, ghcr-public]
    runs-on: ubuntu-latest
    permissions:
      contents: write # changeset publish creates per-package release tags; we push them
      id-token: write # OIDC token exchange for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # changeset publish inspects existing tags to avoid re-tagging
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No registry-url here: setup-node's registry-url writes an .npmrc line
      # expanding ${NODE_AUTH_TOKEN}, which breaks config parsing when the
      # env var is absent — and OIDC needs no token config at all.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile; dependency lifecycle scripts denied by workspace policy)
        run: pnpm install --frozen-lockfile
      # changeset publish creates ANNOTATED per-package tags; without a git
      # identity the tag object cannot be created and the failure is silent —
      # the later tag push then finds nothing ("Everything up-to-date").
      - name: Configure git identity for release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build the publishable closure
        run: pnpm --filter "@3ngram/server..." --filter "3ngram..." run build
      # pnpm publishes directly, NOT via `changeset publish`: changesets
      # captures the spawned pnpm's stdout, which swallows pnpm's
      # "Skipped OIDC: <reason>" diagnostics and turns any auth failure into
      # an opaque E404. `pnpm -r publish` skips private packages and versions
      # already on the registry, performs the OIDC trusted-publishing
      # exchange natively, and prints its OIDC decision to the job log.
      # `--no-git-checks`: the checkout is a detached tag HEAD.
      - name: Publish to npm (OIDC; skips versions already on the registry)
        run: pnpm -r publish --no-git-checks
      # `changeset tag` creates the per-package annotated tags that
      # `changeset publish` would have created (skips tags that already
      # exist; worker is excluded via privatePackages.tag: false).
      - name: Create and push per-package release tags
        run: |
          pnpm exec changeset tag
          git push origin --tags

  github-release:
    name: Publish curated GitHub release
    needs: [validate, npm-publish, ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Create or refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.ghcr.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          source_notes=".github/release-notes/${RELEASE_VERSION}.md"
          if [[ ! -f "$source_notes" ]]; then
            echo "missing curated release notes: $source_notes" >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          cp "$source_notes" "$notes"
          cat >> "$notes" <<EOF

          ## Immutable container reference

          \`ghcr.io/b3dmar/3ngram@${IMAGE_DIGEST}\`
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "3ngram ${RELEASE_VERSION}" \
              --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --target "${{ needs.validate.outputs.commit }}" \
              --title "3ngram ${RELEASE_VERSION}" \
              --notes-file "$notes"
          fi
