name: Release 3ngram-hook

# Publishes 3ngram-hook binaries for Linux and macOS to a GitHub Release.
#
# Trigger: push a tag matching `3ngram-hook-v*` (e.g. `3ngram-hook-v1.0.0`).
# The tag name is embedded into the binary via ldflags so each artifact carries
# its own version (`3ngram-hook version` / `3ngram-hook --version`).
#
# Targets: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64.
# Artifacts: per-target `.tar.gz` archives plus a `checksums.txt` (sha256).
#
# Manual dry-runs are supported via workflow_dispatch (builds + checksums, no
# release is published).
#
# RULE: actions pinned by full SHA, never tags (scripts/check-action-pins.sh).

on:
  push:
    tags:
      - '3ngram-hook-v*'
  workflow_dispatch:

# Read-only by default; only the release job, which publishes the GitHub
# Release, gets write access. The build matrix compiles code and needs none.
permissions:
  contents: read

concurrency:
  group: release-3ngram-hook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/3ngram-hook/go.mod
          # stdlib-only module: there is no go.sum, so the default cache step
          # can only log "Restore cache failed".
          cache: false

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="3ngram-hook-dev-${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: cmd/3ngram-hook
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o 3ngram-hook .

      - name: Package
        working-directory: cmd/3ngram-hook
        run: |
          archive="3ngram-hook-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "${archive}" 3ngram-hook
          mkdir -p dist
          mv "${archive}" dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 3ngram-hook-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cmd/3ngram-hook/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
