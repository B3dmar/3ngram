name: Release 3ngram-hook

# Publishes 3ngram-hook binaries for Linux and macOS to a GitHub Release.
#
# Trigger: push a tag matching `3ngram-hook-v*` (e.g. `3ngram-hook-v1.0.0`).
# The tag name is embedded into the binary via ldflags so each artifact carries
# its own version (`3ngram-hook version` / `3ngram-hook --version`).
#
# Targets: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64.
# Artifacts: per-target `.tar.gz` archives plus a `checksums.txt` (sha256).
#
# Manual dry-runs are supported via workflow_dispatch (builds + checksums, no
# release is published).
#
# RULE: actions pinned by full SHA, never tags (scripts/check-action-pins.sh).

on:
  push:
    tags:
      - '3ngram-hook-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-3ngram-hook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.24'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="3ngram-hook-dev-${GITHUB_SHA::12}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: cmd/3ngram-hook
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o 3ngram-hook .

      - name: Package
        working-directory: cmd/3ngram-hook
        run: |
          archive="3ngram-hook-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "${archive}" 3ngram-hook
          mkdir -p dist
          mv "${archive}" dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 3ngram-hook-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cmd/3ngram-hook/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
